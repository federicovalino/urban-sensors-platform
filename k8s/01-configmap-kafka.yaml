# ---------------------------------------------------------------------------
# Configuración del broker de Kafka (modo KRaft, sin Zookeeper).
# La imagen apache/kafka traduce cada variable KAFKA_X_Y a la propiedad x.y.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-broker-config
  namespace: urban-sensors
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: urban-sensors-platform
data:
  CLUSTER_ID: "dXJiYW4tc2Vuc29ycy0wMQ"
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  # Dirección que el broker le devuelve a los clientes: el DNS estable del Pod
  # (Service headless). Resoluble desde cualquier Pod del clúster.
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0.kafka-headless.urban-sensors.svc.cluster.local:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  # Un solo broker: los tópicos internos no pueden replicarse
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  # El tópico se crea explícitamente (Job) con 3 particiones: nunca autocreado con 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Heap acotado para que la JVM entre en el limit de memoria del Pod
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
